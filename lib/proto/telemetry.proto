syntax = "proto3";

package telemetry;

message SensorData {
  int64 timestamp = 1;
  float accel_x = 2;
  float accel_y = 3;
  float accel_z = 4;
  float gyro_x = 5;
  float gyro_y = 6;
  float gyro_z = 7;
  double latitude = 8;
  double longitude = 9;
}

message RaceRecordingChunk {
  string session_id = 1;
  int32 chunk_index = 2;
  repeated SensorData data_points = 3;
}
